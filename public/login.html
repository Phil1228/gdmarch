<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23c8102e'/><text x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>掼</text></svg>">
<title>登入 / 註冊 · 珑客掼蛋賽務</title>
<style>
  :root{ --red:#c8102e; --gold:#d4af37; --ink:#1a1a1a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"PingFang HK","Microsoft YaHei",sans-serif;
        background:linear-gradient(160deg,#fff 0%,#fff5f5 100%); color:var(--ink);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ width:100%; max-width:400px; background:#fff; border-radius:18px; overflow:hidden;
         box-shadow:0 8px 30px rgba(200,16,46,.15); border:1px solid #ffe0e0; }
  .hd{ background:linear-gradient(135deg,var(--red),#a00d24); color:#fff; padding:26px 24px; text-align:center; }
  .hd .logo{ font-size:30px; font-weight:800; letter-spacing:4px; }
  .hd .logo span{ color:var(--gold); }
  .bd{ padding:24px; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tabs button{ flex:1; padding:10px; border:1px solid #eee; background:#fafafa; border-radius:10px; font-size:15px; font-weight:600; color:#888; cursor:pointer; }
  .tabs button.active{ background:var(--red); color:#fff; border-color:var(--red); }
  label{ display:block; font-size:14px; color:#555; margin:14px 0 6px; font-weight:600; }
  input{ width:100%; padding:13px 14px; font-size:16px; border:1.5px solid #eee; border-radius:10px; outline:none; }
  input:focus{ border-color:var(--red); }
  button.submit{ width:100%; margin-top:22px; padding:15px; font-size:17px; font-weight:700; color:#fff;
          background:linear-gradient(135deg,var(--red),#a00d24); border:none; border-radius:10px; cursor:pointer; }
  .msg{ margin-top:16px; text-align:center; font-size:14px; min-height:20px; }
  .ok{ color:#1a9e4b; } .err{ color:var(--red); }
  .back{ display:block; padding:10px 16px 0; font-size:14px; color:var(--red); text-decoration:none; font-weight:600; }
  .hint{ margin-top:14px; font-size:12px; color:#aaa; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <a href="/" class="back">‹ 返回首頁</a>
    <div class="hd">
      <div class="logo">掼<span>蛋</span></div>
      <div style="margin-top:8px;font-size:14px;opacity:.95">帳號登入</div>
    </div>
    <div class="bd">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')">登入</button>
        <button id="tab-reg" onclick="switchTab('reg')">註冊</button>
      </div>
      <div id="form-login">
        <label>帳號</label>
        <input id="l-user" placeholder="使用者名稱" autocomplete="username">
        <label>密碼</label>
        <input id="l-pass" type="password" placeholder="密碼" autocomplete="current-password">
        <button class="submit" onclick="doLogin()">登入</button>
      </div>
      <div id="form-reg" style="display:none">
        <label>帳號</label>
        <input id="r-user" placeholder="使用者名稱" autocomplete="username">
        <label>顯示名稱（選填）</label>
        <input id="r-name" placeholder="如 菲爾">
        <label>密碼（至少 6 字元）</label>
        <input id="r-pass" type="password" placeholder="密碼" autocomplete="new-password">
        <button class="submit" onclick="doReg()">註冊並登入</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="hint">私享賽需登入才能建立與報名</div>
    </div>
  </div>
<script>
  function switchTab(t) {
    document.getElementById('tab-login').classList.toggle('active', t==='login');
    document.getElementById('tab-reg').classList.toggle('active', t==='reg');
    document.getElementById('form-login').style.display = t==='login'?'block':'none';
    document.getElementById('form-reg').style.display = t==='reg'?'block':'none';
    document.getElementById('msg').textContent='';
  }
  function setMsg(t, ok) { const m=document.getElementById('msg'); m.className='msg '+(ok?'ok':'err'); m.textContent=t; }
  async function doLogin() {
    const username=document.getElementById('l-user').value.trim();
    const password=document.getElementById('l-pass').value;
    if(!username||!password){ setMsg('請填寫帳號與密碼','err'); return; }
    try {
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'失敗');
      setMsg('登入成功，跳轉中…','ok');
      setTimeout(()=>location.href='/', 600);
    } catch(e){ setMsg(e.message,'err'); }
  }
  async function doReg() {
    const username=document.getElementById('r-user').value.trim();
    const password=document.getElementById('r-pass').value;
    const displayName=document.getElementById('r-name').value.trim();
    if(!username||!password){ setMsg('請填寫帳號與密碼','err'); return; }
    try {
      const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,displayName})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'失敗');
      setMsg('註冊成功，跳轉中…','ok');
      setTimeout(()=>location.href='/', 600);
    } catch(e){ setMsg(e.message,'err'); }
  }
</script>
</body>
</html>
