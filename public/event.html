<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23c8102e'/><text x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>掼</text></svg>">
<title>比賽管理</title>
<style>
  :root{ --red:#c8102e; --gold:#d4af37; --ink:#1a1a1a; --line:#eee; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"PingFang HK","Microsoft YaHei",sans-serif; background:#f5f6f8; color:var(--ink); }
  .top{ background:linear-gradient(135deg,var(--red),#a00d24); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .top .logo{ font-weight:800; letter-spacing:2px; font-size:17px; }
  .top .logo span{ color:var(--gold); }
  .top .ev{ font-size:14px; opacity:.95; }
  .top a{ color:#fff; opacity:.85; font-size:13px; text-decoration:none; margin-left:10px; }
  .top .st{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; margin-left:10px; border:1px solid rgba(255,255,255,.6); }
  .top .st.open{ background:rgba(255,255,255,.18); }
  .top .st.started{ background:#fff; color:var(--red); }
  .top .st.closed{ background:rgba(0,0,0,.25); }
  .wrap{ max-width:860px; margin:0 auto; padding:16px; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ padding:9px 16px; background:#fff; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; color:#666; }
  .tab.active{ background:var(--red); color:#fff; border-color:var(--red); }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .card h3{ font-size:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  label{ display:block; font-size:13px; color:#666; margin:10px 0 5px; font-weight:600; }
  input,select,textarea{ width:100%; padding:11px 12px; font-size:15px; border:1.5px solid #e6e6e6; border-radius:9px; outline:none; }
  input:focus,select:focus,textarea:focus{ border-color:var(--red); }
  button{ padding:11px 18px; font-size:15px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--red),#a00d24); border:none; border-radius:9px; cursor:pointer; }
  button.ghost{ background:#fff; color:var(--red); border:1.5px solid var(--red); }
  button.sm{ padding:7px 12px; font-size:13px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div{ flex:1; min-width:140px; }
  table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
  th,td{ padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); }
  th{ color:#888; font-weight:600; font-size:12px; }
  .msg{ margin-top:10px; font-size:13px; min-height:16px; }
  .ok{ color:#1a9e4b; } .err{ color:var(--red); } .muted{ color:#999; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:560px){ .grid2{ grid-template-columns:1fr; } .top .logo{ font-size:15px; } }
  .match{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .match .vs{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .match .team{ flex:1; text-align:center; font-weight:700; }
  .match .vs .x{ color:#bbb; }
  .match .acts{ display:flex; gap:6px; margin-top:10px; }
  .match .acts button{ flex:1; }
  .rank{ display:flex; align-items:center; gap:12px; padding:10px; border-bottom:1px solid var(--line); }
  .rank .pos{ font-size:18px; font-weight:800; width:34px; color:var(--red); }
  .rank .nm{ font-weight:600; }
  .rank .tn{ font-weight:700; }
  .rank .tm{ font-size:12px; color:#777; margin-top:2px; }
  .rank .pt{ margin-left:auto; font-weight:800; color:var(--gold); }
  .bye{ color:#b8821a; font-size:13px; margin-top:6px; }
  .search-box{ margin-top:14px; padding-top:14px; border-top:1px dashed #eee; }
  .results{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .res-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; background:#fafafa; border:1px solid #eee; border-radius:8px; }
  .badge-box{ background:#fff8e8; border:2px dashed var(--gold); border-radius:12px; padding:14px; text-align:center; margin-top:10px; }
  .badge-box .n{ font-size:30px; font-weight:800; color:var(--red); letter-spacing:2px; }
  .link-box{ background:#f0f7ff; border:1px solid #cfe3ff; border-radius:9px; padding:10px; font-size:13px; word-break:break-all; margin-top:8px; }
  /* 牌桌 */
  .table-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; margin:6px 0 12px; width:100%; max-width:420px; }
  .seat-row{ display:flex; align-items:center; justify-content:center; gap:14px; width:100%; flex-wrap:wrap; }
  .seat-row.mid-row{ flex-wrap:nowrap; gap:6px; }
  .seat-row.mid-row .seat{ flex:1 1 0; min-width:0; max-width:34%; }
  .seat-row.mid-row .table-mid{ flex:0 0 32%; width:auto; height:auto; aspect-ratio:1 / 1; }
  .seat{ width:min(150px, 40vw); min-height:56px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; background:#fff; border:2px solid #ddd; position:relative; }
  .seat .pos{ position:absolute; top:4px; left:8px; font-size:11px; font-weight:700; color:#999; }
  .seat .nm{ font-weight:700; font-size:min(15px, 4vw); word-break:break-word; text-align:center; }
  .seat .bd{ font-size:12px; color:#888; }
  .seat.A{ border-color:var(--red); background:#fff3f3; }
  .seat.B{ border-color:#1565c0; background:#f0f6ff; }
  .seat .role{ position:absolute; bottom:4px; right:8px; font-size:10px; font-weight:700; }
  .seat.A .role{ color:var(--red); } .seat.B .role{ color:#1565c0; }
  .table-mid{ width:min(340px, 72vw); height:min(84px, 20vw); border-radius:50%; background:radial-gradient(circle at 50% 40%, #2e7d4f, #1b5e36); display:flex; align-items:center; justify-content:center; color:#cfe9d8; font-weight:700; letter-spacing:2px; box-shadow:inset 0 4px 10px rgba(0,0,0,.3); }
  .mtitle{ font-size:14px; font-weight:700; color:#444; margin-bottom:2px; }
  .mresult{ font-size:12px; color:#666; margin-top:4px; }
  @media (max-width: 480px) {
    .seat-row{ gap:6px; }
    .seat{ width:34vw; max-width:130px; padding:6px; }
    .table-mid{ width:28vw; max-width:110px; height:56px; font-size:13px; }
  }
  .round-btns{ display:flex; flex-wrap:wrap; gap:6px; }
  .round-btns button{ padding:8px 14px; border-radius:8px; border:1.5px solid #e0e0e0; background:#fff; font-size:14px; font-weight:600; color:#666; cursor:pointer; }
  .round-btns button.active{ background:var(--red); color:#fff; border-color:var(--red); }
  .round-teams{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .rt-team{ border:1.5px solid #ddd; border-radius:10px; padding:8px 12px; min-width:160px; background:#fafafa; }
  .rt-team .rt-h{ font-size:12px; font-weight:700; color:#888; margin-bottom:4px; }
  .rt-team.A{ border-color:var(--red); background:#fff3f3; } .rt-team.A .rt-h{ color:var(--red); }
  .rt-team.B{ border-color:#1565c0; background:#f0f6ff; } .rt-team.B .rt-h{ color:#1565c0; }
  .rt-team .m{ font-size:13px; padding:2px 0; }
  .rt-team .m .bd{ color:#999; font-size:11px; margin-left:4px; }
  .rt-team .tn-edit{ width:120px; padding:5px 7px; font-size:14px; border:1.5px solid #ddd; border-radius:7px; margin-bottom:4px; }
  .rt-team .rt-h{ font-size:13px; font-weight:700; margin-bottom:4px; }
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="logo">掼<span>蛋</span> 比賽管理</div>
    <div class="ev" id="ev-title">載入中…</div>
  </div>
  <div>
    <span class="st" id="ev-status"></span>
    <button class="sm" id="btn-start">開始比賽</button>
    <button class="sm" id="btn-qr">報名 QR</button>
    <span id="me-box" style="font-size:12px;opacity:.9;margin-left:8px"></span>
    <a href="/admin">後台</a>
    <a href="/">首頁</a>
  </div>
</div>
<div class="wrap">

  <div class="tabs">
    <div class="tab active" data-tab="roster">名單</div>
    <div class="tab" data-tab="scoring">分組記分</div>
    <div class="tab" data-tab="standings">積分榜</div>
  </div>

  <!-- 名單 -->
  <div class="panel active" id="tab-roster">
    <div class="card">
      <h3>加入選手（將綁定本場比賽）
        <button class="sm ghost" id="btn-qr2">報名 QR</button>
      </h3>
      <div class="row">
        <div><label>姓名（必填）</label><input id="p-name" placeholder="姓名"></div>
        <div><label>手機（選）</label><input id="p-contact" placeholder="手機"></div>
        <div><label>備註（選）</label><input id="p-note" placeholder="備註"></div>
        <div style="flex:0"><button id="btn-add">加入</button></div>
      </div>
      <div class="msg" id="p-msg"></div>
      <div class="search-box">
        <label>從選手庫搜尋加入</label>
        <div class="row" style="align-items:flex-end">
          <div style="flex:1"><input id="p-search" placeholder="輸入姓名關鍵字搜尋全站選手庫"></div>
          <div style="flex:0"><button class="sm" id="btn-search">搜尋</button></div>
        </div>
        <div id="p-results" class="results"></div>
      </div>
    </div>
    <div class="card">
      <h3>批量導入（CSV / 每行：姓名,手機,備註）</h3>
      <textarea id="csv" rows="5" placeholder="小明,8521111,&#10;小華,8522222,&#10;小美,,"></textarea>
      <button class="mt" id="btn-import">匯入並報名本場</button>
      <div class="msg" id="csv-msg"></div>
    </div>
    <div class="card">
      <h3>本場報名名單</h3>
      <table>
        <thead><tr><th>號牌</th><th>姓名</th><th>手機</th><th>備註</th><th>來源</th><th></th></tr></thead>
        <tbody id="p-list"></tbody>
      </table>
    </div>
  </div>

  <!-- 分組記分 -->
  <div class="panel" id="tab-scoring">
    <div class="card">
      <h3>對陣表（所有輪次）</h3>
      <div class="row">
        <div style="flex:1"><label>選擇輪次</label><div id="round-btns" class="round-btns"></div></div>
        <div style="flex:0"><button id="btn-build">生成對陣表</button></div>
        <div style="flex:0"><button class="sm ghost" id="btn-refresh">重置對陣</button></div>
      </div>
      <div class="msg" id="sc-msg"></div>
    </div>
    <div class="card">
      <h3>對陣表</h3>
      <div id="round-teams" class="round-teams"></div>
      <div id="sc-matches"><span class="muted">尚未生成</span></div>
    </div>
  </div>

  <!-- 積分榜 -->
  <div class="panel" id="tab-standings">
    <div class="card">
      <h3>排名</h3>
      <button class="sm" id="btn-st">重新整理</button>
      <div id="st-list"><span class="muted">點上方重新整理</span></div>
    </div>
  </div>

</div>

<!-- QR 彈窗 -->
<div id="qr-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; align-items:center; justify-content:center; padding:16px;">
  <div style="background:#fff; border-radius:16px; max-width:380px; width:100%; padding:22px; text-align:center; position:relative;">
    <button onclick="closeQr()" style="position:absolute; top:10px; right:14px; background:none; border:none; font-size:22px; color:#999; cursor:pointer;">×</button>
    <h3 style="margin-bottom:6px;">掃碼報名</h3>
    <div id="qr-evname" class="muted" style="font-size:13px; margin-bottom:12px;"></div>
    <img id="qr-img" style="width:240px; height:240px; margin:0 auto; display:block; border:1px solid #eee; border-radius:8px;">
    <div class="link-box" id="qr-link" style="margin-top:14px;"></div>
    <div class="row mt" style="gap:8px;">
      <button class="sm" onclick="copyLink()">複製連結</button>
      <button class="sm ghost" onclick="downloadQr()">下載 QR 圖</button>
    </div>
    <div class="msg" id="qr-msg"></div>
  </div>
</div>

<script>
const EID = "__EVENT_ID__";
const api = (path, opt) => fetch(path, opt).then(r => r.json().catch(()=>({})));
const $ = (id) => document.getElementById(id);

// 登入態
async function loadMe() {
  try {
    const d = await (await fetch('/api/auth/me')).json();
    if (d.user) {
      $('me-box').innerHTML = `👤 ${d.user.displayName||d.user.username} · <a href="#" onclick="logout()" style="color:#fff;opacity:.85">登出</a>`;
    } else {
      $('me-box').innerHTML = `<a href="/login" style="color:#fff;opacity:.9">登入</a>`;
    }
  } catch { $('me-box').textContent=''; }
}
window.logout = async () => { await fetch('/api/auth/logout',{method:'POST'}); location.href='/'; };
loadMe();

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('tab-' + t.dataset.tab).classList.add('active');
  if (t.dataset.tab === 'roster') loadRoster();
  if (t.dataset.tab === 'scoring') loadMatches();
  if (t.dataset.tab === 'standings') loadStandings();
});

// 比賽資訊
const ST_MAP = { open:'報名中', started:'進行中', closed:'已結束' };
async function renderStatus(ev) {
  const st = ev?.status || 'open';
  const el = $('ev-status');
  el.className = 'st ' + st;
  el.textContent = ST_MAP[st] || st;
  // 按鈕文案隨狀態變
  const btn = $('btn-start');
  if (st === 'open') { btn.style.display=''; btn.textContent='開始比賽'; }
  else if (st === 'started') { btn.style.display=''; btn.textContent='結束比賽'; }
  else { btn.style.display='none'; }
}
async function loadInfo() {
  const ev = await api('/api/events/' + EID + '/detail');
  if (!ev || !ev.id) { $('ev-title').textContent = '比賽不存在'; return; }
  const c = ev.rule || {};
  const mode = c.scoring_mode === 'team' ? '按隊' : '按個人';
  const rule = ({ time:'計時制', rounds:'局數制', untilA:'打過A為止' }[c.round_rule] || '');
  $('ev-title').textContent = `${ev.name} · ${mode} · 共${c.rounds||'?'}輪 · ${rule}`;
  renderStatus(ev);
}
$('btn-start').onclick = async () => {
  const ev = await api('/api/events/' + EID + '/detail');
  const cur = ev?.status || 'open';
  const next = cur === 'open' ? 'started' : (cur === 'started' ? 'closed' : 'open');
  await api('/api/events/' + EID + '/status', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status: next }) });
  loadInfo();
};

// 名單
async function loadRoster() {
  const rows = await api('/api/events/' + EID + '/registrations');
  const tb = $('p-list');
  if (!Array.isArray(rows) || !rows.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">尚無報名</td></tr>'; return; }
  tb.innerHTML = rows.map(r => `<tr>
    <td>${r.badge_no||''}</td><td>${r.name}</td><td>${r.contact||''}</td><td>${r.note||''}</td>
    <td>${r.status||''}</td>
    <td><button class="sm ghost" onclick="delPlayer(${r.player_id})">移除</button></td>
  </tr>`).join('');
}
$('btn-add').onclick = async () => {
  const name = $('p-name').value.trim();
  if (!name) { $('p-msg').className='msg err'; $('p-msg').textContent='請填姓名'; return; }
  const d = await api('/api/events/' + EID + '/players', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, contact:$('p-contact').value.trim()||null, note:$('p-note').value.trim()||null }) });
  if (d.id) { $('p-msg').className='msg ok'; $('p-msg').textContent=`已加入，號牌 ${d.badge}`;
    $('p-name').value=''; $('p-contact').value=''; $('p-note').value=''; loadRoster(); }
  else { $('p-msg').className='msg err'; $('p-msg').textContent='失敗：'+(d.error||''); }
};
$('btn-import').onclick = async () => {
  const csv = $('csv').value.trim();
  if (!csv) { $('csv-msg').className='msg err'; $('csv-msg').textContent='請貼上資料'; return; }
  const d = await api('/api/events/' + EID + '/import', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ csv }) });
  const n = d.added?.length || 0;
  $('csv-msg').className='msg ok'; $('csv-msg').textContent = `成功匯入 ${n} 人並報名本場`;
  $('csv').value=''; loadRoster();
};
async function delPlayer(pid) {
  if (!confirm('從本場比賽移除該選手？')) return;
  await api('/api/events/' + EID + '/players/' + pid, { method:'DELETE' });
  loadRoster();
}
// 選手庫搜尋加入
$('btn-search').onclick = async () => {
  const q = $('p-search').value.trim();
  if (!q) { $('p-results').innerHTML = '<span class="muted">請輸入關鍵字</span>'; return; }
  const res = await api('/api/players/search?q=' + encodeURIComponent(q));
  if (!res.length) { $('p-results').innerHTML = '<span class="muted">選手庫中無相符選手</span>'; return; }
  $('p-results').innerHTML = res.map(p => `<div class="res-row">
    <span>${p.name} <span class="muted">#${p.badge_no}${p.contact?' · '+p.contact:''}</span></span>
    <button class="sm" onclick="addFromLib(${p.id}, this)">加入本場</button>
  </div>`).join('');
};
window.addFromLib = async (pid, btn) => {
  const info = await api('/api/players/' + pid);
  const d = await api('/api/events/' + EID + '/players', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: info.name }) });
  if (d.id) { btn.textContent='已加入'; btn.disabled=true; loadRoster(); }
};

window.saveTeamName = async (tid) => {
  const name = document.getElementById('tn-' + tid).value.trim();
  if (!name) { alert('隊名不可為空'); return; }
  const d = await api('/api/events/' + EID + '/teams/' + tid + '/rename', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
  if (d.ok) { TM_NAME[tid] = name; loadMatches(); }
  else alert(d.error || '失敗');
};
let CUR_ROUND = 1, TOTAL_ROUNDS = 1;
let TEAM_MAP = {};
let TM_NAME = {};
function renderRoundButtons() {
  const box = $('round-btns');
  if (TOTAL_ROUNDS < 1) { box.innerHTML = ''; return; }
  let h = '';
  for (let r = 1; r <= TOTAL_ROUNDS; r++) {
    h += `<button class="${r===CUR_ROUND?'active':''}" onclick="selRound(${r})">第 ${r} 輪</button>`;
  }
  box.innerHTML = h;
}
window.selRound = (r) => { CUR_ROUND = r; renderRoundButtons(); loadMatches(); };
async function loadMatches() {
  const ev = await api('/api/events/' + EID + '/detail');
  const mode = ev?.rule?.scoring_mode || 'individual';
  const evStatus = ev?.status || 'open';
  TOTAL_ROUNDS = ev?.rule?.rounds || 1;
  renderRoundButtons();
  const roundNo = CUR_ROUND;
  const teamsUrl = mode === 'team' ? ('/api/events/' + EID + '/teams') : ('/api/events/' + EID + '/teams?round=' + roundNo);
  const teams = await api(teamsUrl);
  TEAM_MAP = {};
  (teams||[]).forEach(t => { TEAM_MAP[t.id] = t.members; TM_NAME[t.id] = t.name; }); // 存成員陣列 [{id,name,badge}] + 隊名
  const ms = await api('/api/events/' + EID + '/matches?round=' + roundNo);
  const box = $('sc-matches');
  if (!Array.isArray(ms) || !ms.length) { box.innerHTML = '<span class="muted">本輪尚無對陣，請點「生成所有輪次對陣」</span>'; return; }
  // 牌桌: teamA 坐 北+南(對角), teamB 坐 東+西(對角)
  const seatHtml = (member, side, pos) => {
    if (!member) return `<div class="seat ${side}"><span class="pos">${pos}</span><span class="nm muted">輪空</span></div>`;
    return `<div class="seat ${side}"><span class="pos">${pos}</span><span class="nm">${member.name}</span><span class="bd">#${member.badge||'?'}</span><span class="role">${side==='A'?'紅隊':'藍隊'}</span></div>`;
  };
  const lvOpts = (sel) => LEVELS.map(l => `<option ${l===sel?'selected':''}>${l}</option>`).join('');
  const teamLabel = (side) => side==='A' ? '紅隊' : '藍隊';
  const resultText = (m) => {
    if (!m.winner) return '';
    const lav = m.level_a||'?', lbv = m.level_b||'?';
    if (m.winner==='draw') return `<div class="mresult">平局（紅 ${lav} / 藍 ${lbv} 同級）</div>`;
    const w = m.winner==='A' ? '紅隊' : '藍隊';
    const lv = m.winner==='A' ? lav : lbv;
    return `<div class="mresult">${w}勝（紅 ${lav} / 藍 ${lbv}，勝方 ${lv}）</div>`;
  };
  // 本輪分隊列表
  const rtBox = $('round-teams');
  const allTeamEntries = Object.entries(TEAM_MAP).filter(([k,v]) => v);
  const canEditTeam = evStatus === 'open';
  rtBox.innerHTML = allTeamEntries.map(([tid, members], i) => {
    const side = (i % 2 === 0) ? 'A' : 'B';
    const tname = TM_NAME[tid] || (teamLabel(side) + ' ' + (i+1));
    const mm = members.map(m => `<div class="m">${m.name}<span class="bd">#${m.badge||'?'}</span></div>`).join('');
    const nameCtrl = canEditTeam
      ? `<input class="tn-edit" id="tn-${tid}" value="${tname.replace(/"/g,'&quot;')}"><button class="sm" onclick="saveTeamName(${tid})">存</button>`
      : `<div class="rt-h">${tname}</div>`;
    return `<div class="rt-team ${side}">${nameCtrl}${mm}</div>`;
  }).join('') || '<span class="muted">尚無分隊</span>';
  const canScore = evStatus === 'started';
  if (!canScore) {
    box.innerHTML = ms.map(m => {
      const A = TEAM_MAP[m.team_a] || [];
      const B = TEAM_MAP[m.team_b] || [];
      const done = resultText(m);
      const title = `<div class="mtitle">桌 #${m.id}（第 ${m.round_no||roundNo} 輪）</div>`;
      return `<div class="match" data-id="${m.id}">
        ${title}
        <div class="table-wrap">
          <div class="seat-row">${seatHtml(A[0], 'A', '北')}</div>
          <div class="seat-row mid-row">
            ${seatHtml(B[0], 'B', '西')}
            <div class="table-mid">掼蛋</div>
            ${seatHtml(B[1], 'B', '東')}
          </div>
          <div class="seat-row">${seatHtml(A[1], 'A', '南')}</div>
        </div>
        ${done}
      </div>`;
    }).join('') + '<div class="muted" style="margin-top:10px">比賽狀態為「進行中」才可記分</div>';
    return;
  }
  box.innerHTML = ms.map(m => {
    const A = TEAM_MAP[m.team_a] || [];
    const B = TEAM_MAP[m.team_b] || [];
    const done = resultText(m);
    const title = `<div class="mtitle">桌 #${m.id}（第 ${m.round_no||roundNo} 輪）</div>`;
    const acts = m.winner ? '' : `<div class="acts" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="seat A" style="min-width:auto;padding:4px 8px"><span class="role">紅隊</span></span>
        <select id="lvA-${m.id}">${lvOpts(m.level_a)}</select>
        <span class="seat B" style="min-width:auto;padding:4px 8px"><span class="role">藍隊</span></span>
        <select id="lvB-${m.id}">${lvOpts(m.level_b)}</select>
        <button onclick="recLevel(${m.id})">記錄</button>
      </div>`;
    return `<div class="match" data-id="${m.id}">
      ${title}
      <div class="table-wrap">
        <div class="seat-row">${seatHtml(A[0], 'A', '北')}</div>
        <div class="seat-row mid-row">
          ${seatHtml(B[0], 'B', '西')}
          <div class="table-mid">掼蛋</div>
          ${seatHtml(B[1], 'B', '東')}
        </div>
        <div class="seat-row">${seatHtml(A[1], 'A', '南')}</div>
      </div>
      ${acts}${done}
    </div>`;
  }).join('');
}
$('btn-build').onclick = async () => {
  const ev = await api('/api/events/' + EID + '/detail');
  const mode = ev?.rule?.scoring_mode || 'individual';
  const rounds = ev?.rule?.rounds || 1;
  try {
    const d = await api('/api/events/' + EID + '/build-all', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({}) });
    const n = d.matchups?.length || 0;
    $('sc-msg').className='msg ok'; $('sc-msg').textContent = `已生成 ${rounds} 輪對陣，共 ${n} 場（含輪空）`;
  } catch (e) {
    $('sc-msg').className='msg err'; $('sc-msg').textContent = '失敗：' + (e.message || '');
    return;
  }
  CUR_ROUND = rounds; renderRoundButtons(); loadMatches();
};
$('btn-refresh').onclick = async () => {
  if (!confirm('重整會清空所有已生成的對陣與已記分，重新隨機生成。確定？')) return;
  $('btn-build').click();
};
window.recLevel = async (matchId) => {
  const lvA = $('lvA-' + matchId).value;
  const lvB = $('lvB-' + matchId).value;
  const d = await api('/api/matches', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ matchId, levelA: lvA, levelB: lvB }) });
  if (d.winner) { $('sc-msg').className='msg ok'; $('sc-msg').textContent='已記分 (' + (d.winner==='draw'?'平局':d.winner+'勝') + ')'; loadMatches(); }
  else { $('sc-msg').className='msg err'; $('sc-msg').textContent='失敗：'+(d.error||''); }
};

// 積分榜
$('btn-st').onclick = loadStandings;
async function loadStandings() {
  const st = await api('/api/events/' + EID + '/standings');
  const box = $('st-list');
  if (!Array.isArray(st) || !st.length) { box.innerHTML = '<span class="muted">尚無積分</span>'; return; }
  const isTeam = st[0] && st[0].team_id !== undefined;
  box.innerHTML = st.map((x, i) => {
    let nm;
    if (isTeam) {
      const members = (x.members || []).map(m => `${m.name} <span class="muted">(#${m.badge||'?'})</span>`).join(' + ');
      nm = `<div class="tn">${x.name || ('第 ' + (i+1) + ' 隊')}</div><div class="tm">${members}</div>`;
    } else {
      nm = `${x.name} <span class="muted">(${x.badge})</span>`;
    }
    return `<div class="rank"><div class="pos">${i+1}</div><div class="nm">${nm}</div><div class="pt">${x.points} 分</div></div>`;
  }).join('');
}

// QR
async function genLink() {
  const ev = await api('/api/events/' + EID + '/detail');
  const name = ev?.name || ('比賽 ' + EID);
  const d = await api('/api/events/' + EID + '/qrcode');
  $('qr-evname').textContent = name;
  $('qr-img').src = d.qrcode;
  $('qr-link').textContent = d.link;
  $('qr-msg').textContent = '';
  $('qr-modal').style.display = 'flex';
}
function closeQr() { $('qr-modal').style.display = 'none'; }
async function copyLink() {
  try { await navigator.clipboard.writeText($('qr-link').textContent); $('qr-msg').className='msg ok'; $('qr-msg').textContent='連結已複製'; }
  catch { $('qr-msg').className='msg err'; $('qr-msg').textContent='複製失敗，請手動選取'; }
}
function downloadQr() { const a=document.createElement('a'); a.href=$('qr-img').src; a.download='報名QR.png'; a.click(); }
$('btn-qr').onclick = genLink;
$('btn-qr2').onclick = genLink;

// 初始
loadInfo();
loadRoster();
</script>
</body>
