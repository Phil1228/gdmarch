<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23c8102e'/><text x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>掼</text></svg>">
<title>珑客掼蛋賽務 · 比賽列表</title>
<style>
  :root{ --red:#c8102e; --gold:#d4af37; --ink:#1a1a1a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"PingFang HK","Microsoft YaHei",sans-serif;
        background:linear-gradient(160deg,#fff 0%,#fff5f5 100%); color:var(--ink);
        min-height:100vh; padding:24px 16px 40px; }
  .wrap{ max-width:560px; margin:0 auto; }
  .hd{ text-align:center; padding:18px 0 26px; }
  .hd .logo{ font-size:40px; font-weight:800; letter-spacing:5px; color:var(--red); }
  .hd .logo span{ color:var(--gold); }
  .hd .slogan{ margin-top:8px; font-size:14px; color:#888; letter-spacing:1px; }
  .sec-title{ font-size:15px; color:#999; margin:10px 4px 12px; font-weight:600; }
  .list{ display:flex; flex-direction:column; gap:14px; }
  .ev{ background:#fff; border:1px solid #ffe0e0; border-radius:16px; padding:18px 20px;
       box-shadow:0 6px 20px rgba(200,16,46,.08); text-decoration:none; color:inherit;
       display:block; transition:transform .12s, box-shadow .12s; position:relative; }
  .ev:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(200,16,46,.16); }
  .ev .name{ font-size:19px; font-weight:700; color:var(--ink); }
  .ev .meta{ margin-top:8px; font-size:13px; color:#888; display:flex; flex-wrap:wrap; gap:10px; }
  .ev .tag{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .tag.team{ background:#fde8ec; color:var(--red); }
  .tag.individual{ background:#e8f0fd; color:#2a6bd4; }
  .tag.rule{ background:#fff3df; color:#b8821a; }
  .empty{ text-align:center; color:#aaa; font-size:14px; padding:40px 0; }
  .foot{ text-align:center; font-size:12px; color:#bbb; margin-top:34px; }
  .admin-bar{ display:flex; justify-content:center; margin-top:18px; }
  .admin-bar a{ display:inline-block; padding:11px 26px; border-radius:12px; font-weight:700; font-size:15px;
    background:linear-gradient(135deg,var(--red),#a00d24); color:#fff; text-decoration:none;
    box-shadow:0 6px 16px rgba(200,16,46,.18); }
  .admin-bar a:hover{ transform:translateY(-1px); }
  .ev .go{ position:absolute; top:14px; right:18px; font-size:13px; color:var(--red); font-weight:600; cursor:pointer; }
  .ev .go.mgmt{ right:auto; left:18px; color:#888; }
  .user-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .user-bar .u{ font-size:14px; color:#666; }
  .user-bar a{ color:var(--red); text-decoration:none; font-weight:600; font-size:14px; }
  .tag.private{ background:#efeafe; color:#6a3cc4; }
  /* 滑動開關 */
  .filter-bar{ display:flex; align-items:center; justify-content:center; gap:10px; margin:10px 0 4px; }
  .filter-bar .lbl{ font-size:14px; color:#666; font-weight:600; }
  .switch{ position:relative; display:inline-block; width:46px; height:26px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:26px; transition:.2s; }
  .slider:before{ position:absolute; content:""; height:20px; width:20px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--red); }
  .switch input:checked + .slider:before{ transform:translateX(20px); }
  /* 籤筒 */
  .fortuna{ position:fixed; top:16px; right:16px; z-index:40; display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none; }
  .fortuna .tube{ width:38px; height:54px; position:relative; transition:transform .3s; }
  .fortuna .tube:hover{ transform:translateY(-2px); }
  .fortuna.shake .tube{ animation:shake .5s ease-in-out infinite; }
  @keyframes shake{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-9deg)} 40%{transform:rotate(9deg)} 60%{transform:rotate(-6deg)} 80%{transform:rotate(6deg)} }
  .fortuna .label{ font-size:10px; color:var(--red); font-weight:700; margin-top:2px; }
  .fortuna .stick{ position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:5px; height:18px; background:linear-gradient(#caa,#8a5); border-radius:3px 3px 0 0; }
  .fortuna .stick.s2{ left:38%; } .fortuna .stick.s3{ left:62%; }
  /* 彈層 */
  .fmodal{ position:fixed; inset:0; z-index:60; background:rgba(20,8,8,.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:20px; }
  .fmodal.show{ display:flex; }
  .fcard{ background:#fff; border-radius:22px; max-width:360px; width:100%; padding:28px 24px; text-align:center; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:pop .35s cubic-bezier(.2,1.3,.5,1); }
  @keyframes pop{ from{ transform:scale(.8); opacity:0 } to{ transform:scale(1); opacity:1 } }
  .fcard .close{ position:absolute; top:12px; right:16px; font-size:22px; color:#bbb; cursor:pointer; }
  .fcard .day{ font-size:12px; color:#aaa; }
  .fcard .stage{ height:160px; display:flex; align-items:center; justify-content:center; position:relative; margin:10px 0; }
  .fstage-loading .spinner{ width:54px; height:54px; border:5px solid #ffe0e0; border-top-color:var(--red); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .fstick{ position:absolute; width:10px; height:90px; background:linear-gradient(#e9d9a0,#caa84a); border-radius:5px; transform-origin:bottom center; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .fstick .cap{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:14px; height:14px; background:#c8102e; border-radius:50%; color:#fff; font-size:9px; line-height:14px; text-align:center; }
  .flevel{ font-size:46px; font-weight:800; letter-spacing:4px; opacity:0; transform:scale(.5); animation:reveal .5s .1s forwards; }
  .flevel.l0{ color:#c8102e; text-shadow:0 0 18px rgba(212,175,55,.7); }
  .flevel.l1{ color:#e8862e; }
  .flevel.l2{ color:#1a9e4b; }
  .flevel.l3{ color:#2a6bd4; }
  @keyframes reveal{ from{ opacity:0; transform:scale(.4) rotate(-12deg) } to{ opacity:1; transform:scale(1) rotate(0) } }
  .ftitle{ font-size:20px; font-weight:700; margin-top:6px; opacity:0; animation:fade .4s .4s forwards; }
  .ftext{ font-size:14px; color:#666; line-height:1.7; margin:12px 4px; opacity:0; animation:fade .4s .55s forwards; }
  @keyframes fade{ to{ opacity:1 } }
  .fyi{ display:flex; gap:10px; justify-content:center; font-size:12px; margin-top:8px; opacity:0; animation:fade .4s .7s forwards; }
  .fyi .y{ background:#e8f5e9; color:#1a9e4b; padding:5px 10px; border-radius:8px; }
  .fyi .j{ background:#fde8ec; color:#c8102e; padding:5px 10px; border-radius:8px; }
  .fnote{ font-size:11px; color:#bbb; margin-top:12px; }
  .spark{ position:absolute; width:6px; height:6px; background:var(--gold); border-radius:50%; animation:spark 1s ease-out forwards; }
  @keyframes spark{ from{ transform:scale(1); opacity:1 } to{ transform:translateY(-40px) scale(0); opacity:0 } }
</style>
</head>
<body>
  <!-- 籤筒 -->
  <div class="fortuna" id="fortuna" title="抽今日運勢籤">
    <div class="tube">
      <div class="stick s1"></div><div class="stick s2"></div><div class="stick s3"></div>
      <svg viewBox="0 0 38 54" width="38" height="54">
        <rect x="4" y="14" width="30" height="38" rx="6" fill="#c8102e"/>
        <rect x="4" y="14" width="30" height="10" rx="5" fill="#a00d24"/>
        <ellipse cx="19" cy="14" rx="15" ry="4" fill="#8a0a1c"/>
        <text x="19" y="40" font-size="13" fill="#ffd86b" text-anchor="middle" font-weight="bold">籤</text>
      </svg>
    </div>
    <div class="label">牌運</div>
  </div>
  <!-- 運勢彈層 -->
  <div class="fmodal" id="fmodal">
    <div class="fcard">
      <div class="close" onclick="closeFortuna()">×</div>
      <div class="day" id="f-day"></div>
      <div class="stage fstage-loading" id="f-stage"><div class="spinner"></div></div>
      <div class="flevel" id="f-level" style="display:none"></div>
      <div class="ftitle" id="f-title" style="display:none"></div>
      <div class="ftext" id="f-text" style="display:none"></div>
      <div class="fyi" id="f-yi" style="display:none"></div>
      <div class="fnote" id="f-note"></div>
    </div>
  </div>
  <div class="wrap">
    <div class="hd">
      <div class="logo">掼<span>蛋</span></div>
      <div class="slogan">珑客 Loong-Click · 線下比賽賽務系統</div>
      </div>
      <div class="user-bar" id="user-bar"></div>
      <div class="admin-bar">
        <a href="/admin">進入管理後台</a>
      </div>
      <div class="filter-bar">
        <span class="lbl">只看私享賽</span>
        <label class="switch"><input type="checkbox" id="only-private"><span class="slider"></span></label>
      </div>
      <div class="sec-title">進行中的比賽</div>
    <div class="list" id="list"><div class="empty">載入中…</div></div>
    <div class="foot">掃描比賽 QR 碼或點擊比賽進入報名</div>
  </div>
<script>
  const fmt = (cfg) => {
    if (!cfg) return {};
    try { return JSON.parse(cfg); } catch { return {}; }
  };
  let ME = null;
  async function loadUser() {
    try { const r = await fetch('/api/auth/me'); const d = await r.json(); ME = d.user; } catch { ME = null; }
    const bar = document.getElementById('user-bar');
    if (ME) {
      bar.innerHTML = `<span class="u">👤 ${ME.displayName || ME.username}${ME.role==='admin'?'（管理員）':''}</span><a href="#" onclick="logout()">登出</a>`;
    } else {
      bar.innerHTML = `<span class="u">未登入</span><a href="/login">登入 / 註冊</a>`;
    }
  }
  window.logout = async () => {
    await fetch('/api/auth/logout', { method:'POST' });
    location.href = '/';
  };
  async function load() {
    try {
      const r = await fetch('/api/events');
      const events = await r.json();
      const list = document.getElementById('list');
      if (!Array.isArray(events) || events.length === 0) {
        list.innerHTML = '<div class="empty">暫無進行中的比賽</div>';
        return;
      }
      const onlyPrivate = document.getElementById('only-private')?.checked;
      const shown = onlyPrivate ? events.filter(e => e.visibility === 'private') : events;
      if (shown.length === 0) {
        list.innerHTML = '<div class="empty">暫無符合條件的比賽</div>';
        return;
      }
      list.innerHTML = shown.map(ev => {
        const c = fmt(ev.rule_config);
        const mode = c.scoring_mode === 'team'
          ? '<span class="tag team">按隊</span>'
          : '<span class="tag individual">按個人</span>';
        const ruleMap = { time:'計時制', rounds:'局數制', untilA:'打過A為止' };
        const rule = ruleMap[c.round_rule] || '';
        const ruleTag = rule ? `<span class="tag rule">${rule}</span>` : '';
        const rounds = c.rounds ? `共 ${c.rounds} 輪` : '';
        const st = ev.status || 'open';
        const stMap = { open:'報名中', started:'進行中', closed:'已結束' };
        const stClass = { open:'team', started:'individual', closed:'rule' }[st] || 'team';
        const stTag = `<span class="tag ${stClass}">${stMap[st]||st}</span>`;
        const vis = ev.visibility === 'private' ? '<span class="tag private">私享</span>' : '';
        // 私享賽未登入 -> 點報名跳登入
        const href = (ev.visibility === 'private' && !ME) ? '/login' : `/r/${ev.id}`;
        const viewHref = (ev.visibility === 'private' && !ME) ? '/login' : `/view/${ev.id}`;
        return `<a class="ev" href="${href}">
          <span class="go" onclick="event.preventDefault(); location.href='${viewHref}'">查看 ›</span>
          <div class="name">${ev.name}</div>
          <div class="meta">${stTag}${vis}${mode}${ruleTag}<span>${rounds}</span></div>
        </a>`;
      }).join('');
    } catch (e) {
      document.getElementById('list').innerHTML = '<div class="empty">載入失敗，請稍後再試</div>';
    }
  }
  loadUser().then(load);
  const sw = document.getElementById('only-private');
  if (sw) sw.addEventListener('change', load);

  // ---- 今日運勢籤 ----
  const fortuna = document.getElementById('fortuna');
  const fmodal = document.getElementById('fmodal');
  function closeFortuna() { fmodal.classList.remove('show'); }
  fmodal.addEventListener('click', (e) => { if (e.target === fmodal) closeFortuna(); });
  window.closeFortuna = closeFortuna;

  const LEVELS = ['大吉','中吉','吉','小吉'];
  async function drawFortune() {
    fortuna.classList.add('shake');
    fmodal.classList.add('show');
    // 重置顯示
    document.getElementById('f-stage').className = 'stage fstage-loading';
    document.getElementById('f-stage').innerHTML = '<div class="spinner"></div>';
    ['f-level','f-title','f-text','f-yi'].forEach(id => document.getElementById(id).style.display = 'none');
    document.getElementById('f-note').textContent = '搖動籤筒中…';
    try {
      const r = await fetch('/api/fortune');
      const d = await r.json();
      // 動畫：先轉圈 0.8s，再播放竹籤飛出
      await new Promise(res => setTimeout(res, 800));
      document.getElementById('f-day').textContent = `今日掼蛋牌運 · ${d.date}`;
      const stage = document.getElementById('f-stage');
      stage.className = 'stage';
      stage.innerHTML = '';
      // 竹籤飛出動畫
      const stick = document.createElement('div');
      stick.className = 'fstick';
      stick.innerHTML = '<div class="cap">籤</div>';
      stage.appendChild(stick);
      stick.animate([
        { transform:'translateY(-120px) rotate(-30deg)', opacity:0 },
        { transform:'translateY(0) rotate(8deg)', opacity:1 }
      ], { duration:600, easing:'cubic-bezier(.2,1.4,.5,1)', fill:'forwards' });
      // 撒金粉
      for (let i=0;i<14;i++){
        const s = document.createElement('div'); s.className='spark';
        s.style.left = (20+Math.random()*60)+'%'; s.style.top='40%';
        s.style.animationDelay = (Math.random()*0.4)+'s';
        stage.appendChild(s);
      }
      await new Promise(res => setTimeout(res, 500));
      // 顯示結果
      const lvl = document.getElementById('f-level');
      lvl.textContent = d.level; lvl.className = 'flevel l' + d.levelIdx; lvl.style.display='block';
      const t = document.getElementById('f-title'); t.textContent = d.title; t.style.display='block';
      const tx = document.getElementById('f-text'); tx.textContent = d.text; tx.style.display='block';
      const yi = document.getElementById('f-yi');
      yi.innerHTML = `<span class="y">宜 · ${d.yi}</span><span class="j">忌 · ${d.ji}</span>`;
      yi.style.display='flex';
      document.getElementById('f-note').textContent = d.loggedIn ? `已為你的牌運定今日之籤（同日不變）` : `未登入：依網路與裝置特徵定籤，登入後牌運更穩定`;
    } catch(e) {
      document.getElementById('f-note').textContent = '求籤失敗，請稍後再試';
      document.getElementById('f-stage').innerHTML = '🙏';
    } finally {
      fortuna.classList.remove('shake');
    }
  }
  fortuna.addEventListener('click', drawFortune);
</script>
</body>
</html>
