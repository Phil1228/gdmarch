<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23c8102e'/><text x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>掼</text></svg>">
<title>珑客掼蛋賽務 · 比賽列表</title>
<style>
  :root{ --red:#c8102e; --gold:#d4af37; --ink:#1a1a1a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"PingFang HK","Microsoft YaHei",sans-serif;
        background:linear-gradient(160deg,#fff 0%,#fff5f5 100%); color:var(--ink);
        min-height:100vh; padding:24px 16px 40px; }
  .wrap{ max-width:560px; margin:0 auto; }
  .hd{ text-align:center; padding:18px 0 26px; }
  .hd .logo{ font-size:40px; font-weight:800; letter-spacing:5px; color:var(--red); }
  .hd .logo span{ color:var(--gold); }
  .hd .slogan{ margin-top:8px; font-size:14px; color:#888; letter-spacing:1px; }
  .sec-title{ font-size:15px; color:#999; margin:10px 4px 12px; font-weight:600; }
  .list{ display:flex; flex-direction:column; gap:14px; }
  .ev{ background:#fff; border:1px solid #ffe0e0; border-radius:16px; padding:18px 20px;
       box-shadow:0 6px 20px rgba(200,16,46,.08); text-decoration:none; color:inherit;
       display:block; transition:transform .12s, box-shadow .12s; position:relative; }
  .ev:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(200,16,46,.16); }
  .ev .name{ font-size:19px; font-weight:700; color:var(--ink); }
  .ev .meta{ margin-top:8px; font-size:13px; color:#888; display:flex; flex-wrap:wrap; gap:10px; }
  .ev .tag{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .tag.team{ background:#fde8ec; color:var(--red); }
  .tag.individual{ background:#e8f0fd; color:#2a6bd4; }
  .tag.rule{ background:#fff3df; color:#b8821a; }
  .empty{ text-align:center; color:#aaa; font-size:14px; padding:40px 0; }
  .foot{ text-align:center; font-size:12px; color:#bbb; margin-top:34px; }
  .admin-bar{ display:flex; justify-content:center; margin-top:18px; }
  .admin-bar a{ display:inline-block; padding:11px 26px; border-radius:12px; font-weight:700; font-size:15px;
    background:linear-gradient(135deg,var(--red),#a00d24); color:#fff; text-decoration:none;
    box-shadow:0 6px 16px rgba(200,16,46,.18); }
  .admin-bar a:hover{ transform:translateY(-1px); }
  .ev .go{ position:absolute; top:14px; right:18px; font-size:13px; color:var(--red); font-weight:600; cursor:pointer; }
  .ev .go.mgmt{ right:auto; left:18px; color:#888; }
  .user-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .user-bar .me{ font-size:13px; color:#888; }
  .user-bar .me b{ color:var(--red); }
  .rank-card{ background:#fff; border:1px solid #ffe0e0; border-radius:16px; padding:18px 20px;
       box-shadow:0 6px 20px rgba(200,16,46,.08); margin-bottom:24px; }
  .rank-card h3{ font-size:15px; color:#999; margin-bottom:14px; font-weight:600; }
  .rank-item{ display:flex; align-items:center; padding:8px 0; border-bottom:1px solid #ffe0e0; }
  .rank-item:last-child{ border-bottom:none; }
  .rank-no{ width:28px; font-weight:700; color:var(--red); font-size:14px; }
  .rank-name{ flex:1; font-size:14px; }
  .rank-badge{ font-size:12px; color:var(--gold); font-weight:600; margin-right:8px; }
  .rank-points{ font-size:13px; color:#888; text-align:right; min-width:60px; }
  .rank-total{ font-size:14px; color:var(--ink); font-weight:600; text-align:right; }
  .rank-empty{ text-align:center; color:#aaa; font-size:14px; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="logo">珑客<span>·</span>掼蛋</div>
    <div class="slogan">比賽列表</div>
  </div>

  <div class="admin-bar">
    <a href="/admin.html">管理後台</a>
  </div>

  <div class="user-bar" id="user-bar" style="display:none">
    <div class="me">你好，<b id="user-name"></b></div>
    <div><a href="/api/auth/logout">登出</a></div>
  </div>

  <div class="sec-title">🏆 總積分排行榜</div>
  <div class="rank-card" id="rank-card">
    <div class="rank-empty" id="rank-empty">載入中...</div>
    <div id="rank-list" style="display:none"></div>
  </div>

  <div class="sec-title">賽事列表</div>
  <div class="list" id="event-list">
    <div class="empty">載入中...</div>
  </div>

  <div class="foot">珑客掼蛋賽務系統 · 掼蛋比賽報名與積分管理</div>
</div>

<script>
async function loadUser() {
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const u = await res.json();
      const bar = document.getElementById('user-bar');
      bar.style.display = 'flex';
      document.getElementById('user-name').textContent = u.display_name || u.username;
    }
  } catch {}
}

async function loadRankings() {
  try {
    const res = await fetch('/api/rankings');
    if (res.ok) {
      const rankings = await res.json();
      const empty = document.getElementById('rank-empty');
      const list = document.getElementById('rank-list');
      if (!rankings || !rankings.length) {
        empty.textContent = '暫無積分記錄';
        list.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      list.style.display = 'block';
      list.innerHTML = rankings.slice(0, 20).map((r, i) => `
        <div class="rank-item">
          <div class="rank-no">${i + 1}</div>
          <div class="rank-name">
            <span class="rank-badge">${r.rank}·${r.grade}級</span>
            ${r.name || ('#'+r.id)}
          </div>
          <div class="rank-points">${r.total_points}分</div>
        </div>
      `).join('');
    } else {
      document.getElementById('rank-empty').textContent = '無法載入排行榜';
    }
  } catch {
    document.getElementById('rank-empty').textContent = '無法載入排行榜';
  }
}

async function loadEvents() {
  const el = document.getElementById('event-list');
  try {
    const res = await fetch('/api/events');
    if (!res.ok) { el.innerHTML = '<div class="empty">載入失敗</div>'; return; }
    const events = await res.json();
    if (!events.length) {
      el.innerHTML = '<div class="empty">目前沒有任何賽事</div>';
      return;
    }
    el.innerHTML = events.map(ev => {
      const mode = ev.rule?.scoring_mode || 'individual';
      const rounds = ev.rule?.rounds || 1;
      const m = ev.rule?.participant_count;
      const tags = [
        `<span class="tag ${mode}">${mode === 'team' ? '團體' : '個人'}</span>`,
        `<span class="tag rule">${rounds}輪${m ? ' · '+m+'人' : ''}</span>`
      ];
      return `
        <a class="ev" href="/event.html?id=${ev.id}">
          <div class="name">${esc(ev.name)}</div>
          <div class="meta">${tags.join('')}</div>
        </a>
      `;
    }).join('');
  } catch {
    el.innerHTML = '<div class="empty">載入失敗</div>';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadUser();
loadRankings();
loadEvents();
</script>
</body>
</html>
